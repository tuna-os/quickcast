name: Publish Quickcast Flatpak
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR (and the TunaOS index when its credential is available)
        type: boolean
        default: true
permissions:
  contents: write
  packages: write
jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      index-token: ${{ steps.token.outputs.available }}
    steps:
      - id: token
        env:
          INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          if [ -n "$INDEX_TOKEN" ]; then echo 'available=true' >> "$GITHUB_OUTPUT";
          else echo 'available=false' >> "$GITHUB_OUTPUT"; fi
  build:
    needs: configuration
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: org.tunaos.Quickcast
      manifest-path: org.tunaos.Quickcast.json
      repo-name: tuna-os/quickcast
      archs: '["x86_64"]'
      attach-bundles: true
      publish: ${{ needs.configuration.outputs.index-token == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    secrets:
      # In build-only mode this credential is unused. A repository-scoped
      # GITHUB_TOKEN satisfies the shared workflow's required input without
      # granting or attempting cross-repository access.
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN || secrets.GITHUB_TOKEN }}
  publish-package:
    needs: [configuration, build]
    if: needs.configuration.outputs.index-token != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: oci-x86_64
          path: oci-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: bundle-x86_64
          path: bundles
      - name: Publish GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy oci:oci-x86_64 docker://ghcr.io/tuna-os/quickcast:latest-x86_64
          skopeo copy oci:oci-x86_64 docker://ghcr.io/tuna-os/quickcast:latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            skopeo copy oci:oci-x86_64 "docker://ghcr.io/tuna-os/quickcast:$GITHUB_REF_NAME"
          fi
      - name: Attach release bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" bundles/*.flatpak --repo "$GITHUB_REPOSITORY" --clobber
      - name: Report index handoff
        run: |
          echo 'Package published. FLATPAK_INDEX_TOKEN is unavailable, so the central index must be updated from the oci-x86_64 artifact by an authorized maintainer.' >> "$GITHUB_STEP_SUMMARY"
