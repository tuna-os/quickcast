name: Publish Quickcast Flatpak
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR (and the TunaOS index when its credential is available)
        type: boolean
        default: true
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  configuration:
    runs-on: ubuntu-24.04
    # Reads a secret only; the job token is unused.
    permissions: {}
    outputs:
      index-key: ${{ steps.key.outputs.available }}
    steps:
      - id: key
        env:
          INDEX_DEPLOY_KEY: ${{ secrets.FLATPAK_INDEX_DEPLOY_KEY }}
        run: |
          if [ -n "$INDEX_DEPLOY_KEY" ]; then echo 'available=true' >> "$GITHUB_OUTPUT";
          else echo 'available=false' >> "$GITHUB_OUTPUT"; fi
  build:
    needs: configuration
    # The shared workflow pushes to GHCR and uploads release bundles.
    permissions:
      contents: write
      packages: write
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@4078f531ac74703f203bde835ef6c25e9321b97b # main # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead
    with:
      app-id: org.tunaos.Quickcast
      manifest-path: org.tunaos.Quickcast.json
      repo-name: tuna-os/quickcast
      archs: '["x86_64"]'
      attach-bundles: true
      publish: ${{ needs.configuration.outputs.index-key == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    secrets:
      # The docs deploy key the shared workflow pushes the central index with.
      # In build-only mode it is unused.
      FLATPAK_INDEX_DEPLOY_KEY: ${{ secrets.FLATPAK_INDEX_DEPLOY_KEY }}
  publish-package:
    needs: [configuration, build]
    if: needs.configuration.outputs.index-key != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    # skopeo pushes to GHCR; gh release upload attaches the bundle.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-x86_64
          path: oci-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-x86_64
          path: bundles
      - name: Publish GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy oci:oci-x86_64 docker://ghcr.io/tuna-os/quickcast:latest-x86_64
          skopeo copy oci:oci-x86_64 docker://ghcr.io/tuna-os/quickcast:latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            skopeo copy oci:oci-x86_64 "docker://ghcr.io/tuna-os/quickcast:$GITHUB_REF_NAME"
          fi
      - name: Attach release bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" bundles/*.flatpak --repo "$GITHUB_REPOSITORY" --clobber
      - name: Report index handoff
        run: |
          echo 'Package published. FLATPAK_INDEX_DEPLOY_KEY is unavailable, so the central index must be updated from the oci-x86_64 artifact by an authorized maintainer.' >> "$GITHUB_STEP_SUMMARY"
