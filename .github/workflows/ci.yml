name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build installable Flatpak
        run: ./scripts/build-local.sh
      - name: Test recording, decoded video, clipboard and UI
        run: ./scripts/test-local.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Quickcast
          path: |
            Quickcast.flatpak
            test-artifacts/

  # Report-only: collects Rust unit-test coverage (the same tests meson runs as
  # `cargo-test`) and publishes lcov.info as an artifact. Runs inside the GNOME 50
  # SDK, like build-and-test: the Ubuntu archive ships gtk4 4.14 and libadwaita 1.5,
  # below the minimums meson.build requires (gtk4 >= 4.15.3, libadwaita >= 1.9).
  coverage:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install flatpak and GNOME 50 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Configure (generates src/config.rs and resources)
        run: |
          flatpak run --user --share=network --filesystem="$PWD" --command=sh org.gnome.Sdk//50 -c '
            set -eu
            export PATH=/usr/lib/sdk/rust-stable/bin:$PATH
            cd "$1"
            # Install into a workspace-local prefix so PKGDATADIR (baked into
            # config.rs) points at resources.gresource and the GSchema, which
            # the unit tests load. Without this they default to /usr/local and
            # nothing is installed there inside the sandbox.
            meson setup _build --prefix="$1/_stage/app"
            meson compile -C _build
            meson install -C _build --no-rebuild
            glib-compile-schemas "$1/_stage/app/share/glib-2.0/schemas"
          ' sh "$PWD"
      - name: Install Rust coverage tooling
        run: |
          flatpak run --user --share=network --filesystem="$PWD" --command=sh org.gnome.Sdk//50 -c '
            set -eu
            export PATH=/usr/lib/sdk/rust-stable/bin:$PATH
            export CARGO_HOME="$1/.cargo-home"
            if command -v rustup >/dev/null 2>&1; then rustup component add llvm-tools-preview; fi
            cargo install --locked cargo-llvm-cov
          ' sh "$PWD"
      - name: Collect unit-test coverage
        run: |
          xvfb-run -a flatpak run --user --socket=x11 --nosocket=wayland --share=network \
            --filesystem="$PWD" --command=dbus-run-session org.gnome.Sdk//50 -- sh -c '
            set -eu
            export PATH=/usr/lib/sdk/rust-stable/bin:$1/.cargo-home/bin:$PATH
            export CARGO_HOME="$1/.cargo-home"
            export GSETTINGS_BACKEND=memory GSK_RENDERER=cairo
            export GSETTINGS_SCHEMA_DIR="$1/_stage/app/share/glib-2.0/schemas"
            cd "$1"
            cargo llvm-cov --lcov --output-path lcov.info -- --nocapture
            cargo llvm-cov report --summary-only | tee coverage-summary.txt
          ' sh "$PWD"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt
          if-no-files-found: warn
