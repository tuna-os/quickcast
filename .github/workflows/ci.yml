name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build installable Flatpak
        run: ./scripts/build-local.sh
      - name: Test recording, decoded video, clipboard and UI
        run: ./scripts/test-local.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Quickcast
          path: |
            Quickcast.flatpak
            test-artifacts/
